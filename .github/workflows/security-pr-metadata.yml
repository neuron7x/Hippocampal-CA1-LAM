name: Security - PR metadata

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  verify-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          normalized = body.strip()
          if not normalized:
              print("PR body is required (must include Phase/Closes and Verification).")
              sys.exit(1)

          phase_or_closes = re.search(r"(Phase:\s*\d+\.\d+|Closes\s*#\d+)", normalized, re.IGNORECASE)
          if not phase_or_closes:
              print("PR body must include 'Phase: X.Y' or 'Closes #123'.")
              sys.exit(1)

          verification_section = re.search(r"Verification:\s*(.+)", normalized, re.IGNORECASE | re.DOTALL)
          if not verification_section:
              print("PR body must include a 'Verification:' section with commands run.")
              sys.exit(1)

          # Ensure there is non-whitespace content after Verification:
          post_verification = verification_section.group(1)
          commands = [line for line in post_verification.splitlines() if line.strip()]
          if not commands:
              print("Verification section must list the commands that were executed.")
              sys.exit(1)

          print("✓ PR metadata requirements satisfied.")
          PY
