name: Security - Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3

      - name: Run pip-audit
        run: |
          set -o pipefail
          mkdir -p pip-audit-reports
          status=0
          if [ -f requirements.txt ]; then
            if ! pip-audit -r requirements.txt --format json --output pip-audit-reports/requirements.json --progress-spinner off; then
              rc=$?
              if [ $status -eq 0 ]; then status=$rc; fi
            fi
            if ! pip-audit -r requirements.txt --progress-spinner off > pip-audit-reports/requirements.txt; then
              rc=$?
              if [ $status -eq 0 ]; then status=$rc; fi
            fi
          else
            echo "requirements.txt not found, skipping" | tee pip-audit-reports/requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            if ! pip-audit -r requirements-dev.txt --format json --output pip-audit-reports/requirements-dev.json --progress-spinner off; then
              rc=$?
              if [ $status -eq 0 ]; then status=$rc; fi
            fi
            if ! pip-audit -r requirements-dev.txt --progress-spinner off > pip-audit-reports/requirements-dev.txt; then
              rc=$?
              if [ $status -eq 0 ]; then status=$rc; fi
            fi
          else
            echo "requirements-dev.txt not found, skipping" | tee pip-audit-reports/requirements-dev.txt
          fi
          exit $status

      - name: Upload audit reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-reports
          path: pip-audit-reports
          retention-days: 14
          if-no-files-found: ignore
