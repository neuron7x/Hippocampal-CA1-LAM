name: Security - Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3

      - name: Run pip-audit
        run: |
          set -o pipefail
          mkdir -p pip-audit-reports
          status=0
          run_audit() {
            local req_file=$1
            local label=$2
            if [ -f "$req_file" ]; then
              if ! pip-audit -r "$req_file" --format json --output "pip-audit-reports/${label}.json" --progress-spinner off; then
                rc=$?
                if [ $status -eq 0 ]; then status=$rc; fi
              fi
              if ! pip-audit -r "$req_file" --progress-spinner off > "pip-audit-reports/${label}.txt"; then
                rc=$?
                if [ $status -eq 0 ]; then status=$rc; fi
              fi
            else
              echo "$req_file not found, skipping" | tee "pip-audit-reports/${label}.txt"
            fi
          }
          run_audit requirements.txt requirements
          run_audit requirements-dev.txt requirements-dev
          exit $status

      - name: Upload audit reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-reports
          path: pip-audit-reports
          retention-days: 14
          if-no-files-found: ignore
