name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONHASHSEED: '0'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.10.12'
          enable-cache: false
      - name: Install hash-locked environment
        env:
          LOCK: ci/requirements-${{ matrix.python }}.txt
        run: |
          uv venv --python "$(command -v python)" .venv
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: "$LOCK"
          uv pip install --python .venv/bin/python --dry-run --only-binary :all: \
            -c "$LOCK" -r ci/requirements.in
          uv pip check --python .venv/bin/python
      - name: Run unit, golden, and demonstration checks
        run: |
          . .venv/bin/activate
          make test
      - name: Build and exercise the installed distribution
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct)
          python=.venv/bin/python
          "$python" -m build --no-isolation
          uv pip install --python "$python" --no-deps dist/*.whl
          uv pip check --python "$python"
          config="$PWD/configs/base.yaml"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/ca1-test"
          "$GITHUB_WORKSPACE/$python" -I -c \
            'import sys; from core.config import load_config; load_config(sys.argv[1])' "$config"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: distribution-py${{ matrix.python }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  static:
    name: Static and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.10.12'
          enable-cache: false
      - name: Run repository policy and static checks
        run: |
          uv venv --python "$(command -v python)" .venv
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: ci/requirements-3.12.txt
          . .venv/bin/activate
          python scripts/ci_policy_check.py
          python scripts/unicode_scan.py
          python scripts/validate_configs.py .
          bash scripts/check_docs_links.sh local
          make lint
      - name: Audit hash-locked dependencies and generate SBOMs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sboms"
          status=0
          for version in 3.11 3.12 3.13; do
            .venv/bin/python -m pip_audit --strict --disable-pip --no-deps --require-hashes \
              -r "ci/requirements-$version.txt" --format cyclonedx-json \
              --output "$RUNNER_TEMP/sboms/py$version.cdx.json" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sboms-${{ github.sha }}
          path: ${{ runner.temp }}/sboms/
          if-no-files-found: error
          retention-days: 14
      - name: Lint workflows with verified actionlint
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" |
            sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: '1.24.1'
          inputs: .github
          strict-collection: true
          online-audits: false
          advanced-security: false
          annotations: true

  secrets:
    name: Gitleaks history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history with verified Gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" |
            sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gitleaks-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 14

  gate:
    name: CI gate
    if: always()
    needs: [tests, static, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every dependency to finish successfully
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            keys == ["secrets", "static", "tests"] and
            all(.[]; .result == "success")
          ' <<< "$NEEDS"
