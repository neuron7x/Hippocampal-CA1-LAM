name: Phase Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check PR references Phase Issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "$PR_BODY" ]]; then
            echo "⚠️  PR has no body description"
            exit 1
          fi
          if ! echo "$PR_BODY" | grep -qE "(Closes #[0-9]+|Phase:)" ; then
            echo "⚠️  PR should reference a Phase issue from Evolution Plan (e.g., 'Closes #123' or 'Phase: X.Y')"
            exit 1
          fi
          echo "✓ PR references a Phase issue or section"

      - name: Verify PR template exists
        run: |
          if [[ -f .github/PULL_REQUEST_TEMPLATE.md ]]; then
            echo "✓ PR template found"
          else
            echo "⚠️  PR template not found"
            exit 1
          fi
