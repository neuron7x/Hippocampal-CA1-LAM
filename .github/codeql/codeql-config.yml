name: "Hippocampal-CA1-LAM CodeQL Configuration"

# Disable default queries to use our custom set
disable-default-queries: false

# Use the standard security-and-quality query suite
queries:
  - uses: security-and-quality

# Configure paths to analyze
paths:
  - core
  - plasticity
  - validation
  - ai_integration
  - data
  - scripts
  - tools
  - utils

# Paths to ignore during analysis
paths-ignore:
  - tests
  - examples
  - docs
  - '**/*.md'
  - '**/*.txt'
  - '**/*.json'
  - '**/*.yaml'
  - '**/*.yml'

# Query filters for Python-specific security issues
query-filters:
  # Include all security queries
  - include:
      tags contain: security

  # Include code quality queries
  - include:
      tags contain: maintainability

  # Focus on high-severity issues
  - include:
      problem.severity:
        - error
        - warning
