apiVersion: v1
kind: Namespace
metadata:
  name: mlsdm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlsdm-config
  namespace: mlsdm
data:
  MLSDM_ENVIRONMENT: "production"
  MLSDM_SERVER__WORKERS: "4"
  MLSDM_NEURO__N_NEURONS: "1000"
  MLSDM_NEURO__SEED: "42"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlsdm-api
  namespace: mlsdm
  labels:
    app: mlsdm-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlsdm-api
  template:
    metadata:
      labels:
        app: mlsdm-api
    spec:
      containers:
      - name: api
        image: mlsdm:latest
        ports:
        - containerPort: 8000
          name: http
        command:
        - python
        - -m
        - src.mlsdm.serve
        - serve
        - --mode
        - api
        envFrom:
        - configMapRef:
            name: mlsdm-config
        - secretRef:
            name: mlsdm-secrets
            optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlsdm-api
  namespace: mlsdm
spec:
  selector:
    app: mlsdm-api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlsdm-neuro
  namespace: mlsdm
  labels:
    app: mlsdm-neuro
    component: neuro-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlsdm-neuro
  template:
    metadata:
      labels:
        app: mlsdm-neuro
    spec:
      containers:
      - name: neuro
        image: mlsdm:latest
        ports:
        - containerPort: 8000
          name: http
        command:
        - python
        - -m
        - src.mlsdm.serve
        - serve
        - --mode
        - neuro
        envFrom:
        - configMapRef:
            name: mlsdm-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlsdm-neuro
  namespace: mlsdm
spec:
  selector:
    app: mlsdm-neuro
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP
